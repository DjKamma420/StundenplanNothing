# Kein Build-Vorgang — nur die Prüfungen, die ein kaputtes Deployment
# verhindern. Ein Fehler in app.js macht die App auf allen Geräten
# unbenutzbar. Die Logik steht in werkzeug/pruefen.mjs, damit sie hier und
# auf dem Rechner dieselbe ist.
name: Prüfen

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_call:        # damit deploy.yml diese Prüfungen davorschalten kann

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Alle statischen Prüfungen
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            node werkzeug/pruefen.mjs --basis HEAD~1
          else
            node werkzeug/pruefen.mjs
          fi
          node werkzeug/pruefungen/bilddaten.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser nur für die Prüfungen vorbereiten
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Grundfunktionen, Sprache, Handyansicht und Bildanhänge
        run: |
          node werkzeug/pruefungen/grund.mjs
          node werkzeug/pruefungen/layout.mjs
          node werkzeug/pruefungen/sprache.mjs
          node werkzeug/pruefungen/bilder.mjs
