name: v49 Härtung

on:
  push:
    branches:
      - fix/v49-haertung
    paths:
      - .github/workflows/v49-patch.yml

permissions:
  contents: write

jobs:
  patchen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch anwenden
        run: python3 .github/v49_patch.py

      - name: Statisch prüfen
        run: |
          node --check app.js
          node --check sw.js
          node werkzeug/pruefen.mjs --basis origin/main

      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Alle Browserprüfungen
        run: |
          set -e
          for t in werkzeug/pruefungen/*.mjs; do
            echo "===== $t ====="
            node "$t"
          done

      - name: Committen
        run: |
          rm -rf node_modules package-lock.json package.json
          rm .github/workflows/v49-patch.yml .github/v49_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js CHANGELOG.md werkzeug/pruefungen/v49.mjs
          git add -u .github/workflows/v49-patch.yml .github/v49_patch.py
          git commit -m "v49: Datenkompatibilität und Kontrast härten"
          git push origin HEAD:fix/v49-haertung
